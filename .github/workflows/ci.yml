name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへ連続 push したときは古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # 1つ落ちても残りのチェック結果を見たいので中断しない
      fail-fast: false
      matrix:
        task:
          - lint:check
          - format:check
          - typecheck
          - test
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から解決される
      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          # setup-node は .mise.toml を読めないため直書き。.mise.toml と揃えること
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.task }}

  # ストーリーを実ブラウザで動かして axe-core にかける検査。
  # ブラウザの用意が要るぶん手順が違うので、check マトリクスとは別ジョブにする
  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          # setup-node は .mise.toml を読めないため直書き。.mise.toml と揃えること
          node-version: 24.14.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # インストール済みの playwright から直接読む。runner に jq 等を要求しない
      - name: Resolve playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # ブラウザバイナリは 90MB 超あるのでバージョンをキーにキャッシュする
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # 検査に使うのは Chromium だけ。キャッシュヒット時もシステム依存ライブラリのために実行する
      # （バイナリのダウンロードはスキップされる）
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:a11y

  # 配布物が利用側から使える形になっているかの検査。
  # React の外部化と light-dark() の保持は、ビルドが成功したままでも壊れるため機械で見る
  dist:
    name: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          # setup-node は .mise.toml を読めないため直書き。.mise.toml と揃えること
          node-version: 24.14.1
          cache: pnpm

      # prepare スクリプトでビルドまで走る
      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:dist
